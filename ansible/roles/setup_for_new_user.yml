#        msg: SET UP FOR NEW USER - 1-2) Edit sshd_config (Allow users only SSH public-key access)
#
#- name: 1-2) Edit sshd_config (Allow users only SSH public-key access)
#  ansible.builtin.import_playbook: users/configure_sshd.yml


- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP FOR NEW USER - 1-3) Distribute the SSH public-key to users

- name: 1-3) Distribute the SSH public-key to users
  ansible.builtin.import_playbook: users/distribute_public_keys.yml


- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP FOR NEW USER - 1-4) Generate and distribute an SSH key to connect from ansible to users

- name: 1-4) Generate and distribute an SSH key to connect from ansible to users
  ansible.builtin.import_playbook: users/keygen_ansible.yml


- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP FOR NEW USER - 1-5) Set the limit of disk usage per user

- name: 1-5) Set the limit of disk usage per user
  ansible.builtin.import_playbook: users/quota_per_user.yml



- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP FOR NEW USER - 2-1) MAKE NAS DIRECTORY

- name: 2-1) Mount NAS
  ansible.builtin.import_playbook: nas/make_user_directory.yml


- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP FOR NEW USER - 3-1) Set up Docker Rootless

- name: 3-1) Set up Docker Rootless
  ansible.builtin.import_playbook: docker/setup_docker_rootless.yml


- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP FOR NEW USER - 3-2) Set up a Jupyter container per user

- name: 3-2) Set up a Jupyter container per user
  ansible.builtin.import_playbook: docker/setup_jupyter_containers.yml

