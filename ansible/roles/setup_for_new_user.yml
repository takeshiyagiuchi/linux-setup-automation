# https://docs.ansible.com/ansible/latest/collections/ansible/builtin/import_playbook_module.html

- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP FOR NEW USER - 1-1) Add users

- name: 1-1) Add users
  ansible.builtin.import_playbook: users/add_users.yml


#- hosts: all
#  become: true
#  tasks:
