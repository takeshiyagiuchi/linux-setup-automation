  ansible.builtin.import_playbook: docker/install_docker.yml


- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP ALL AT ONCE - 5-2) Install nvidia-container-runtime (for using GPU on a container)

