- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP ALL AT ONCE - 2-1) Add users

- name: 2-1) Add users
  ansible.builtin.import_playbook: users/add_users.yml


- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP ALL AT ONCE - 2-2) Edit sshd_config (Allow users only SSH public-key access)

- name: 2-2) Edit sshd_config (Allow users only SSH public-key access)
  ansible.builtin.import_playbook: users/configure_sshd.yml


- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP ALL AT ONCE - 2-3) Distribute the SSH public-key to users

- name: 2-3) Distribute the SSH public-key to users
  ansible.builtin.import_playbook: users/distribute_public_keys.yml


- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP ALL AT ONCE - 2-4) Generate and distribute an SSH key to connect from ansible to users

- name: 2-4) Generate and distribute an SSH key to connect from ansible to users
  ansible.builtin.import_playbook: users/keygen_ansible.yml


- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP ALL AT ONCE - 2-5) Install quota

- name: 2-5) Install quota
  ansible.builtin.import_playbook: users/quota_installation.yml


- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP ALL AT ONCE - 2-6) Set the limit of disk usage per user

- name: 2-6) Set the limit of disk usage per user
  ansible.builtin.import_playbook: users/quota_per_user.yml



- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP ALL AT ONCE - 3-1) Mount NAS

- name: 3-1) Mount NAS
  ansible.builtin.import_playbook: nas/mount_nas.yml


- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP ALL AT ONCE - 3-2) Set up automount of NAS

- name: 3-2) Set up automount of NAS
  ansible.builtin.import_playbook: nas/setup_automount.yml


- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP FOR NEW USER - 3-3) Make user directory under NAS

- name: 3-3) Mount NAS
  ansible.builtin.import_playbook: nas/make_user_directory.yml



- hosts: all
  become: true
  tasks:
    - ansible.builtin.debug:
        msg: SET UP ALL AT ONCE - 4-1) Install Nvidia driver

- name: 4-1) Install Nvidia driver
  ansible.builtin.import_playbook: gpu/install_nvidia_driver.yml



